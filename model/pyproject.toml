[project]
name = "model"
version = "0.1.0"
description = "Offline modeling for the engine: the xT grid and the goal model, trained on StatsBomb data."
readme = "README.md"
authors = [
    { name = "Carlos Ramirez", email = "carsuelos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "engine",
    "numpy>=2.3",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
engine = { path = "../engine", editable = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
