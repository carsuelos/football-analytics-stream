name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: engine
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy
      - run: uv run pytest

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: engine
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: make setup
      - run: make check-gen
