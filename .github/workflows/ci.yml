name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  notifier:
    name: Notifier (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: notifier/go.mod
          cache-dependency-path: notifier/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  markets:
    name: Markets (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: markets/go.mod
          cache-dependency-path: markets/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: engine
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy
      - run: uv run pytest

  model:
    name: Model (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: model
          enable-cache: true
          cache-dependency-glob: model/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: |
            simulator/go.sum
            notifier/go.sum
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: engine
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: make setup
      - run: make check-gen

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep
        run: az bicep install
      # Warnings fail too (bicepconfig.json sets which rules apply).
      - name: Lint
        run: make lint-infra 2>&1 | tee lint.txt; ! grep -E "Warning|Error" lint.txt

  images:
    name: Images and smoke test (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Tagged as Compose names them and loaded into Docker, so Compose starts
      # the stack without building again.
      - name: Build the Compose images
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            simulator.tags=football-analytics-simulator
            simulator.cache-from=type=gha,scope=simulator
            simulator.cache-to=type=gha,scope=simulator,mode=max
            notifier.tags=football-analytics-notifier
            notifier.cache-from=type=gha,scope=notifier
            notifier.cache-to=type=gha,scope=notifier,mode=max
            engine.tags=football-analytics-engine
            engine.cache-from=type=gha,scope=engine
            engine.cache-to=type=gha,scope=engine,mode=max
            dashboard.tags=football-analytics-dashboard
            dashboard.cache-from=type=gha,scope=dashboard
            dashboard.cache-to=type=gha,scope=dashboard,mode=max
      - uses: astral-sh/setup-uv@v10.2.0
      # Only the final's data, kept in the Actions cache (it is never committed).
      - name: Cache the match data
        id: data
        uses: actions/cache@v6
        with:
          path: data
          key: data-3869685-${{ hashFiles('scripts/fetch_statsbomb.py', 'scripts/fetch_xt_grid.py') }}
      - name: Fetch the match data
        if: steps.data.outputs.cache-hit != 'true'
        run: make fetch-data ARGS="--match-id 3869685"
      - name: Smoke test
        run: make smoke-compose COMPOSE_BUILD=--no-build
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: make down
