# The whole stack: `make up`, then open http://localhost:3000.
# Needs `make fetch-data` first: match data and the xT grid are mounted from
# ./data (they can't be redistributed, so they are never baked into images).
#
# The simulator publishes the broadcast to Kafka (Redpanda here) and the engine
# consumes it from there, publishing its metrics and alerts back; the notifier
# delivers the alerts to a webhook (ALERT_WEBHOOK, by default the `webhook`
# service, which prints them). Every app takes librdkafka settings as KAFKA_*
# variables, so pointing them at another cluster (Event Hubs, Confluent Cloud)
# is config only.
#
# The apps also send traces over OTLP to the Aspire dashboard
# (http://localhost:18888), the way they send them to Application Insights in
# Azure: the simulator's "send events", the engine's "receive events" and the
# alerts it raises, and the notifier's webhook calls, as one trace.
name: football-analytics

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 2s
      timeout: 10s
      retries: 30

  # The apps don't create topics: here a one-shot job does, in the cloud IaC will.
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint:
      - rpk
      - topic
      - create
      - events
      - metrics
      - alerts
      - --if-not-exists
      - --partitions=3
    environment:
      RPK_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  # A local viewer for traces (and anything else sent over OTLP).
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_PORT:-18888}:18888"

  simulator:
    build: simulator
    command: ["-jitter", "${SIM_JITTER:-0s}"]
    environment: *app-env
    volumes:
      # Writable: the dashboard's "Add matches" downloads more into it.
      - ./data/statsbomb:/data/statsbomb
    ports:
      - "${SIM_PORT:-8080}:8080"
    depends_on:
      topics:
        condition: service_completed_successfully

  engine:
    build: engine
    command: ["--simulator", "http://simulator:8080", "--source", "kafka"]
    environment: *app-env
    volumes:
      - ./data/xt:/data/xt:ro
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    depends_on:
      simulator:
        condition: service_started
      topics:
        condition: service_completed_successfully

  dashboard:
    build: dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"
    depends_on:
      engine:
        condition: service_healthy
      markets:
        condition: service_started

  # The prediction markets' prices (Kalshi, Polymarket US, Novig), read from
  # their public APIs; the dashboard's Markets page.
  markets:
    build: markets
    environment:
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889
      # Records every league's prices to data/markets/<UTC date>/<league>.jsonl
      # (a market tape, for replaying strategies later). MARKETS_RECORD_DIR= turns it off.
      MARKETS_RECORD_DIR: ${MARKETS_RECORD_DIR-/data/markets}
    volumes:
      - ./data/markets:/data/markets
    ports:
      - "${MARKETS_PORT:-8090}:8090"

  notifier:
    build: notifier
    command: ["-webhook", "${ALERT_WEBHOOK:-http://webhook:9000}"]
    environment: *app-env
    depends_on:
      topics:
        condition: service_completed_successfully
      webhook:
        condition: service_healthy

  # A stand-in for a real webhook (Slack, Teams, ...): prints each alert, and
  # lists them at GET /alerts.
  webhook:
    image: python:3.13-slim
    command: ["python", "/webhook_echo.py", "--host", "0.0.0.0"]
    volumes:
      - ./scripts/webhook_echo.py:/webhook_echo.py:ro
    ports:
      - "${WEBHOOK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/alerts', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
