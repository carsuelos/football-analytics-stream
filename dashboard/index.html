<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Football Analytics</title>
    <!-- The theme the viewer chose (ThemeToggle.tsx), before anything paints. -->
    <script>
      try {
        if (localStorage.getItem('theme.light') === '1') document.documentElement.classList.add('light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
