<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- An app of its own (Safari: File > Add to Dock), so notifications carry its icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="apple-mobile-web-app-title" content="Football" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Football Analytics</title>
    <!-- The theme the viewer chose (ThemeToggle.tsx), before anything paints. -->
    <script>
      try {
        if (localStorage.getItem('theme.light') === '1') document.documentElement.classList.add('light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
