[project]
name = "engine"
version = "0.1.0"
description = "Real-time football analytics engine: rolling metrics and tactical alerts."
readme = "README.md"
authors = [
    { name = "Carlos Ramirez", email = "carsuelos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.16.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
engine = "engine.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "certifi>=2026.7.22",
    "datamodel-code-generator==0.83.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/engine/schema"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "../scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
